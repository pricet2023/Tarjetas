#cloud-config
# Provisioning for the pronunciation scorer's box (plan §19, infra/README.md).
#
# Paste this into Oracle Cloud's "Show advanced options -> Cloud-init script"
# when launching the instance. It gets the box to the point where the only
# things left are the ones that genuinely need a human: a deploy key, the
# secrets, the 197 MB of weights, and the tunnel login.
#
# Shape: VM.Standard.A1.Flex, 4 OCPU / 24 GB — the whole Always Free ARM
# allowance. Image: Canonical Ubuntu 24.04 (aarch64).
#
# No ingress rules are added, and none are needed: the box talks *out* to
# Tailscale and both the scorer and SSH arrive back down that connection. The
# scorer itself binds 127.0.0.1, so it is not reachable even from the VCN.

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - ca-certificates
  - gnupg

users:
  - default
  # The service account. No login shell: nothing should ever be sitting on the
  # box as the user that can read the JWT secret.
  - name: scorer
    system: true
    shell: /usr/sbin/nologin
    homedir: /opt/flash-cards
    create_home: false
  # The CI account. It exists so that GitHub Actions never logs in as `ubuntu`
  # and never holds root: everything it is allowed to do is in the sudoers
  # drop-in below.
  #
  # No `ssh_authorized_keys`, deliberately. Tailscale SSH authenticates against
  # the tailnet ACL rather than an authorized_keys file, so there is no private
  # key in a GitHub secret to leak or rotate (infra/README.md §8).
  - name: deploy
    shell: /bin/bash

write_files:
  # Secrets live here, not in the checkout. Created empty and unreadable so
  # that the unit fails loudly rather than starting up unauthenticated.
  - path: /etc/flash-cards/scorer.env
    permissions: "0640"
    owner: root:scorer
    content: |
      # Filled in by hand — see infra/README.md step 4.
      SCORER_HOST=127.0.0.1
      SCORER_PORT=8787
      # SUPABASE_URL=https://<project>.supabase.co
      # SUPABASE_JWT_SECRET=<only for projects still signing HS256>
      # SCORER_ALLOWED_ORIGINS=https://<your-app>.vercel.app

  # What the deploy account may do, and nothing else. Kept in step with
  # infra/deploy-sudoers, which is the copy to reinstall from on a box that
  # already exists. See the comments there for why neither grant is broader
  # and why infra/deploy.sh is deliberately not named in one.
  - path: /etc/sudoers.d/flash-cards-deploy
    permissions: "0440"
    owner: root:root
    content: |
      deploy ALL=(scorer) NOPASSWD: ALL
      deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart scorer, /usr/bin/systemctl status scorer, /usr/bin/systemctl is-active scorer

runcmd:
  # Node 24: `server/run.mjs` relies on native TypeScript stripping and
  # `process.loadEnvFile`, neither of which exists in Ubuntu's packaged node.
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - apt-get install -y nodejs

  # Tailscale. Installed but deliberately NOT brought up: `tailscale up` needs
  # an auth key, and anything in this file is visible in the Oracle console
  # for the life of the instance. It is a one-line interactive step instead
  # (infra/README.md §6).
  - curl -fsSL https://tailscale.com/install.sh | sh

  - mkdir -p /opt/flash-cards
  - chown scorer:scorer /opt/flash-cards
  # `deploy` runs git and npm in the checkout as `scorer`, so it needs to be
  # able to cd into it. 0755 is enough; nothing secret is in there.
  - chmod 0755 /opt/flash-cards

  # A malformed drop-in locks sudo out entirely, so prove it parses while
  # there is still a console to fix it from.
  - visudo -c

  # Unattended security updates. This box is exposed through a tunnel and
  # nobody is going to remember to log in and patch it.
  - apt-get install -y unattended-upgrades
  - systemctl enable --now unattended-upgrades

final_message: "Base image ready. Continue from step 3 of infra/README.md."
